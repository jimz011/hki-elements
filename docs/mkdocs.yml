site_name: HKI Elements Card Suite Documentation
site_url: https://jimz011.github.io/hki-elements/
docs_dir: .
site_dir: ../site
theme:
  name: material
  logo: assets/hki-elements.png
  features:
    - navigation.indexes
    - navigation.path
    - navigation.tracking
    - navigation.instant
    - toc.follow
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - tables
extra_css:
  - assets/stylesheets/extra.css
nav:
  - Home: index.md
  - Installation: installation.md
  - Cards:
